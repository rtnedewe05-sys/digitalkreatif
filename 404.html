<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halaman tidak ditemukan</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f766e">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<style>
:root{--bg:#f6f8f6;--card:#fff;--tx:#14201b;--mu:#5b6b63;--ac:#0f766e;--bd:#dbe4df}
@media(prefers-color-scheme:dark){:root{--bg:#0f1815;--card:#16231e;--tx:#e8f0ec;--mu:#9bb0a6;--ac:#2dd4bf;--bd:#243a32}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--tx);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.box{max-width:440px;text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:28px 22px}
h1{font-size:56px;margin:0;color:var(--ac);line-height:1.1}
h2{font-size:20px;margin:8px 0}
p{color:var(--mu);margin:8px 0 18px}
a{display:inline-block;margin:4px;padding:10px 18px;border-radius:10px;border:1px solid var(--ac);color:var(--ac);text-decoration:none;font-weight:600}
a.p{background:var(--ac);color:#fff}
@media(prefers-color-scheme:dark){a.p{color:#0f1815}}
</style>
</head>
<body>
<main class="box">
<h1>404</h1>
<h2>Halaman tidak ditemukan</h2>
<p>Alamat yang kamu buka tidak ada atau sudah dipindahkan.</p>
<a class="p" href="/">Ke beranda</a>
<a href="/surah/">Daftar 114 surat</a>
</main>
</body>
</html>
